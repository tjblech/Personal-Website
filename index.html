<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TJ Blechman — Northeastern computer science student interested in startups, software engineering, and quant.">
  <meta name="theme-color" content="#161220">
  <title>TJ Blechman</title>
  <link rel="stylesheet" href="portfolio.css">
</head>
<body>
  <div class="ph-root" id="phRoot">
    <canvas class="ph-flowfield" id="phFlowField"></canvas>
    <div class="ph-vignette"></div>

    <div class="ph-eyes-wrap" id="phEyesWrap">
      <div class="ph-eyes" id="phEyes">
        <div class="ph-pupil" id="phPupilL"></div>
        <div class="ph-pupil" id="phPupilR"></div>
      </div>
      <div class="ph-eyes-hint">click me</div>
    </div>

    <div class="ph-hero">
      <div class="ph-eyebrow" id="phEyebrow">TJ BLECHMAN · BOSTON · COMPUTER SCIENCE</div>
      <div class="ph-name-line" id="phNameStage" aria-label="Hi, I'm TJ Blechman">
        <div class="ph-typed-line" id="phTypedLine" aria-hidden="true">
          <span id="phPrefix"></span><span id="phName" class="ph-name-cycle"></span><span class="ph-cursor" id="phCursor"></span>
        </div>
      </div>
      <p class="ph-tagline" id="phTagline"></p>
      <nav class="ph-actions" id="phActions" aria-label="Portfolio links">
        <a class="ph-action primary" href="#work">see my work <span class="ph-action-arrow" aria-hidden="true">↘</span></a>
        <a class="ph-action" href="#about">about</a>
        <a class="ph-action" href="mailto:tjblech@gmail.com">contact</a>
      </nav>
    </div>

    <div class="ph-modal-backdrop" id="phModalBackdrop">
      <div class="ph-modal">
        <button class="ph-modal-close" id="phModalClose" type="button" aria-label="Close chess">×</button>
        <div class="ph-modal-title">Chess</div>
        <div class="ph-modal-sub" id="phStatus">you're white — make a move</div>
        <div class="ph-board" id="phBoard"></div>
        <div class="ph-modal-footer">
          <button class="ph-small-btn" id="phReset" type="button">new game</button>
        </div>
      </div>
    </div>
  </div>

  <section class="pw-section" id="work">
    <div class="pw-glow"></div>
    <div class="pw-grain"></div>
    <div class="pw-divider"></div>

    <div class="pw-header" id="pwHeader">
      <span class="pw-eyebrow"><span class="sr-only" id="pwEyebrowSR"></span><span aria-hidden="true" id="pwEyebrowText"></span></span>
      <h2 class="pw-heading"><span class="sr-only" id="pwHeadingSR"></span><span aria-hidden="true" id="pwHeadingText"></span></h2>
      <p class="pw-intro" id="pwIntro"></p>
    </div>

    <div class="pw-editor" id="pwEditor">
      <div class="pw-editor-chrome">
        <span class="pw-dot red"></span><span class="pw-dot yellow"></span><span class="pw-dot green"></span>
        <span class="pw-editor-path">~/projects</span>
      </div>
      <div class="pw-editor-body">
        <div class="pw-sidebar" role="tablist" aria-label="Projects" aria-orientation="vertical" id="pwSidebar">
          <div class="pw-sidebar-prompt">tj@portfolio ~/projects $ ls</div>
        </div>
        <div class="pw-pane" id="pwPane"></div>
      </div>
    </div>
  </section>

  <script src="hero.js"></script>
  <script src="work.js"></script>
</body>
</html>
