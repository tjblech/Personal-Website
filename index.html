<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TJ Blechman — Northeastern computer science student interested in startups, software engineering, and quant.">
  <meta name="theme-color" content="#161220">
  <title>TJ Blechman</title>
  <style>html,body{margin:0;min-height:100%;background:#161220;color:#f1ecf5;font-family:system-ui,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#b3a7c2;font-size:14px}</style>
</head>
<body>
  <div class="loading" id="loading">loading…</div>
  <script>
  (async()=>{
    const source='https://raw.githubusercontent.com/tjblech/Personal-Website/d18f2138ab1ea7bf7d0bb3d3d79d302a6e2096b8/index.html';
    const response=await fetch(source);
    if(!response.ok) throw new Error(`Could not load homepage (${response.status})`);
    let html=await response.text();
    html=html.replace('href="#work">see my work','href="work.html">see my work');
    document.open();
    document.write(html);
    document.close();
  })().catch(error=>{
    document.getElementById('loading').textContent=error.message;
  });
  </script>
</body>
</html>
