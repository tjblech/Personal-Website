<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Selected work by TJ Blechman.">
  <meta name="theme-color" content="#161220">
  <title>Work — TJ Blechman</title>
  <style>html,body{margin:0;min-height:100%;background:#161220;color:#f1ecf5;font-family:system-ui,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#b3a7c2;font-size:14px}</style>
</head>
<body>
  <div class="loading" id="loading">loading work…</div>
  <script>
  (async()=>{
    const source='https://raw.githubusercontent.com/tjblech/Personal-Website/8f4a200969d6aedb8cdbe2e220a563765d3547cf/.github/workflows/install-work-page.yml';
    const response=await fetch(source);
    if(!response.ok) throw new Error(`Could not load work page (${response.status})`);
    const workflow=await response.text();
    const match=workflow.match(/<<'PAYLOAD'\n([A-Za-z0-9+/=\n]+)\nPAYLOAD/);
    if(!match) throw new Error('Work page payload was not found.');
    const payload=match[1].replace(/\s/g,'');
    if(!('DecompressionStream' in window)) throw new Error('This browser is too old to open the work page.');
    const bytes=Uint8Array.from(atob(payload),c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  })().catch(error=>{
    document.getElementById('loading').textContent=error.message;
  });
  </script>
</body>
</html>
