name: Install work page

on:
  push:
    branches:
      - hero-redesign

permissions:
  contents: write

jobs:
  install-work-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: hero-redesign

      - name: Create work page and connect hero link
        shell: bash
        run: |
          cat > /tmp/work-page.b64 <<'PAYLOAD'

PAYLOAD
          base64 --decode /tmp/work-page.b64 | gzip --decompress > work.html
          python - <<'PYCODE'
          from pathlib import Path
          path = Path('index.html')
          content = path.read_text()
          old = 'href="#work">see my work'
          new = 'href="work.html">see my work'
          if old not in content and new not in content:
              raise SystemExit('Could not find the See my work link in index.html')
          path.write_text(content.replace(old, new))
          PYCODE
          rm -f .github/workflows/install-work-page.yml

      - name: Commit generated page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html work.html .github/workflows/install-work-page.yml
          git commit -m "Add interactive work page"
          git push origin HEAD:hero-redesign
