<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — TJ Blechman</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --bg:#161220;
  --ink:#f1ecf5;
  --ink-solid:#221e27;
  --muted:#b3a7c2;
  --rose:#e2a9b2;
  --gold:#e3c17f;
}
*{ box-sizing:border-box; }
html,body{
  margin:0; height:100%;
  background:var(--bg); color:var(--ink);
  font-family:'Inter',sans-serif;
}
.wrap{
  position:relative;
  min-height:100vh; min-height:100svh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center;
  padding:24px;
  overflow:hidden;
}
.glow{
  position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(560px 420px at 50% 40%, rgba(226,169,178,0.16), transparent 60%);
}
.content{ position:relative; z-index:1; max-width:460px; }
.code{
  font-family:'JetBrains Mono', monospace;
  font-size:13px; letter-spacing:0.14em;
  color:var(--gold);
  margin:0 0 18px;
}
h1{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:clamp(28px, 6vw, 44px);
  margin:0 0 16px;
}
p{
  color:var(--muted);
  font-size:15px; line-height:1.6;
  margin:0 0 34px;
}
.home{
  display:inline-flex; align-items:center; gap:8px;
  font-size:14px; font-weight:600; color:var(--ink-solid);
  background:linear-gradient(135deg, var(--gold), var(--rose));
  padding:12px 26px; border-radius:24px; text-decoration:none;
  transition:filter .2s ease, transform .2s ease;
}
.home:hover{ filter:brightness(1.08); transform:translateY(-1px); }
</style>
</head>
<body>
<div class="wrap">
  <div class="glow"></div>
  <div class="content">
    <p class="code">404 / NOT FOUND</p>
    <h1>this page wandered off</h1>
    <p>Whatever you were looking for isn't here. Might've moved, might never have existed.</p>
    <a class="home" href="/">back to the homepage &#8594;</a>
  </div>
</div>
</body>
</html>
